name: Deploy to EC2

on:
  push:
    branches:
      - main   # run CI/CD on push to main branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Copy code to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "."
          target: "/home/ubuntu/Exilieen_full_stack"

      - name: Run deploy script on EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/Exilieen_full_stack/backend
            npm install
            pm2 restart exilieen-backend || pm2 start server.js --name exilieen-backend

            cd /home/ubuntu/Exilieen_full_stack/frontend
            npm install
            npm run build

            sudo systemctl reload nginx


